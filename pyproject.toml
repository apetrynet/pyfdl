[project]
name = "fdl"
version = "0.1.0"
description = "Pydantic-based ASC Framing Decision List (FDL) data model and toolkit"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.25.1",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdl"]

[tool.hatch.build.targets.wheel.force-include]
"src/fdl/schema" = "fdl/schema"

[tool.hatch.build.targets.sdist]
include = [
    "src/fdl/**/*.py",
    "src/fdl/schema/**/*.json",
]
